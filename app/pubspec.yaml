name: fluxforge
description: "FluxForge mobile client."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 官方 Material UI 解耦组件库 (Flutter 3.47+)
  material_ui: ^1.1.1
  animations: ^3.0.0
  # 路由
  go_router: ^18.0.1
  # js引擎quickJS
  flutter_js: ^0.8.7
  # 网络
  dio: ^5.11.1
  # webview
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  # 图片
  cached_network_image: ^4.0.0
  # 播放器
  chewie: ^1.16.2
  path: ^1.9.1
  path_provider: ^2.1.6
  # 存储
  hive_ce: ^2.15.0
  hive_ce_flutter: ^2.3.3
  # 权限
  permission_handler: ^12.0.3
  # 获取appx信息
  package_info_plus: ^10.2.1
  # 设备信息
  device_info_plus: ^13.2.0
  # 分享
  share_plus: ^13.3.0
  # 画中画
  floating: ^6.0.0
  logger: ^2.8.0
  # 异常捕获
  catcher_2: ^2.1.12
  # 状态管理
  riverpod: ^3.4.3
  # React 钩子在 Flutter 上的实现
  flutter_hooks: ^0.21.3+1
  # 依赖管理
  get_it: ^9.2.0
  extended_image: ^10.1.0
  # 图标
  lucide_icons_flutter: ^3.1.19
  # 保持屏幕唤醒
  wakelock_plus: ^1.8.0
  url_launcher: ^6.3.2
  # 状态管理
  signals_flutter: ^7.1.0
  # 持久化存储
  shared_preferences: ^2.5.5

  video_player: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.16.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/js/
    - assets/images/
    - assets/filters/
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  
