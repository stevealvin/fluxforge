<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FluxForge · AppLoading 三体极光流转 (Triple Celestial Orbs)</title>
<style>
  :root {
    --bg: #07090E;
    --card: #0F141F;
    --border: #1B2232;
    --text: #F8FAFC;
    --sub: #8E9DB5;
    --accent: #10B981;
  }
  body.light {
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --border: #E2E8F0;
    --text: #0F172A;
    --sub: #64748B;
    --accent: #059669;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: all 0.3s ease;
  }
  .container { max-width: 980px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: var(--sub); font-size: 13px; margin: 0; }
  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
  }

  /* 三体极光流转 · 完整三球架构 */
  .css-demo-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .sunset-loader {
    width: 96px; height: 96px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .sunset-orb {
    position: absolute;
    border-radius: 50%;
  }
  /* Orb 1: 58px 翡翠碧星 */
  .orb-1 {
    width: 58px; height: 58px;
    background: radial-gradient(circle at 35% 35%, #A7F3D0, #10B981 70%, transparent 100%);
    animation: morph1 3.6s cubic-bezier(0.37,0,0.63,1) infinite;
  }
  /* Orb 2: 54px 苍穹天星 */
  .orb-2 {
    width: 54px; height: 54px;
    background: radial-gradient(circle at 65% 65%, #BAE6FD, #0284C7 75%, transparent 100%);
    animation: morph2 3.6s cubic-bezier(0.37,0,0.63,1) infinite;
  }
  /* Orb 3: 44px 中心呼吸高光晶核 */
  .orb-3 {
    width: 44px; height: 44px;
    background: radial-gradient(circle at 50% 50%, #FFFFFF, #38BDF8 65%, transparent 100%);
    box-shadow: 0 0 22px rgba(56, 189, 248, 0.4);
    animation: morph3 3.6s cubic-bezier(0.37,0,0.63,1) infinite;
  }
  @keyframes morph1 {
    0%,100% { transform: translate(-10px,-6px) scale(0.92); }
    50% { transform: translate(10px,6px) scale(1.12); }
  }
  @keyframes morph2 {
    0%,100% { transform: translate(10px,6px) scale(1.1); }
    50% { transform: translate(-10px,-6px) scale(0.9); }
  }
  @keyframes morph3 {
    0%,100% { transform: scale(0.88); opacity: 0.75; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  /* Canvas 复刻对照与各尺寸表现 */
  .canvas-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .sizes-row {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    padding: 16px;
    background: rgba(255,255,255,0.02);
    border-radius: 12px;
  }
  .size-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--sub);
  }
  .btn-scenario {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 9px;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.25);
    font-size: 12.5px;
    color: var(--text);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>三体极光流转 (Triple Celestial Horizon Orbs)</h1>
      <p>完整三球系统：两颗对流穿行星体 + 中心呼吸晶核 · 极光天青新色系</p>
    </div>
    <button class="btn" id="themeBtn">切换浅色模式</button>
  </header>

  <!-- 1. CSS 完整三球动效 -->
  <div class="css-demo-card">
    <div style="font-size: 14px; font-weight: 600; color: var(--accent);">CSS 完整三球效果 (96px · 极光碧绿 + 苍穹天蓝 + 中心晶核)</div>
    <div class="sunset-loader">
      <div class="sunset-orb orb-1"></div>
      <div class="sunset-orb orb-2"></div>
      <div class="sunset-orb orb-3"></div>
    </div>
  </div>

  <!-- 2. Flutter Canvas 复刻效果多尺寸展示 -->
  <div class="canvas-card">
    <div style="font-size: 14px; font-weight: 600; color: var(--accent);">Flutter Canvas 算法还原 (多尺寸自适应)</div>
    <div class="sizes-row" id="canvasRow"></div>
    <div class="btn-scenario">
      <canvas id="btnCanvas" width="28" height="28" style="width:14px; height:14px;"></canvas>
      <span>规则测试执行中...</span>
    </div>
  </div>
</div>

<script>
function drawTripleOrbs(ctx, size, t, isDark) {
  const cx = size / 2, cy = size / 2;
  const isSmall = size < 22;

  // 周期 3.6s
  const u = (t / 3.6) % 1.0;
  // EaseInOutSine
  const f = (1 - Math.cos(u * 2 * Math.PI)) / 2;

  const k = size / 96.0;

  // Orb 1 (58px, (-10, -6) ~ (10, 6), scale 0.92 ~ 1.12)
  const baseR1 = 29.0 * k;
  const scale1 = 0.92 + 0.20 * f;
  const r1 = baseR1 * scale1;
  const dx1 = (-10.0 + 20.0 * f) * k;
  const dy1 = (-6.0 + 12.0 * f) * k;
  const x1 = cx + dx1;
  const y1 = cy + dy1;

  // Orb 2 (54px, (10, 6) ~ (-10, -6), scale 1.10 ~ 0.90)
  const baseR2 = 27.0 * k;
  const scale2 = 1.10 - 0.20 * f;
  const r2 = baseR2 * scale2;
  const dx2 = (10.0 - 20.0 * f) * k;
  const dy2 = (6.0 - 12.0 * f) * k;
  const x2 = cx + dx2;
  const y2 = cy + dy2;

  // Orb 3 (44px Core, center (0, 0), scale 0.88 ~ 1.08, opacity 0.75 ~ 1.0)
  const baseR3 = 22.0 * k;
  const scale3 = 0.88 + 0.20 * f;
  const r3 = baseR3 * scale3;
  const op3 = 0.75 + 0.25 * f;

  // 1) 绘制 Orb 1 (极光碧玉)
  const g1 = ctx.createRadialGradient(x1 - r1 * 0.30, y1 - r1 * 0.30, 0, x1, y1, r1);
  if (isDark) {
    g1.addColorStop(0, '#A7F3D0');
    g1.addColorStop(0.70, '#10B981');
    g1.addColorStop(1.0, 'transparent');
  } else {
    g1.addColorStop(0, '#6EE7B7');
    g1.addColorStop(0.70, '#059669');
    g1.addColorStop(1.0, 'transparent');
  }
  ctx.save();
  ctx.globalAlpha = isSmall ? 0.95 : (isDark ? 0.85 : 0.80);
  ctx.fillStyle = g1;
  ctx.beginPath();
  ctx.arc(x1, y1, r1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 2) 绘制 Orb 2 (苍穹天青)
  const g2 = ctx.createRadialGradient(x2 + r2 * 0.30, y2 + r2 * 0.30, 0, x2, y2, r2);
  if (isDark) {
    g2.addColorStop(0, '#BAE6FD');
    g2.addColorStop(0.75, '#0284C7');
    g2.addColorStop(1.0, 'transparent');
  } else {
    g2.addColorStop(0, '#7DD3FC');
    g2.addColorStop(0.75, '#0369A1');
    g2.addColorStop(1.0, 'transparent');
  }
  ctx.save();
  ctx.globalAlpha = isSmall ? 0.95 : (isDark ? 0.85 : 0.80);
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.arc(x2, y2, r2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 3) 绘制 Orb 3 (中心晶核，弥补两球分离时的中心视觉留白)
  const g3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r3);
  g3.addColorStop(0, '#FFFFFF');
  g3.addColorStop(0.55, isDark ? '#38BDF8' : '#0EA5E9');
  g3.addColorStop(1.0, 'transparent');

  ctx.save();
  ctx.globalAlpha = isSmall ? 0.95 : (op3 * (isDark ? 0.90 : 0.85));
  if (!isSmall && isDark) {
    ctx.shadowColor = 'rgba(56, 189, 248, 0.45)';
    ctx.shadowBlur = r3 * 0.8;
  }
  ctx.fillStyle = g3;
  ctx.beginPath();
  ctx.arc(cx, cy, r3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 极小尺寸下为中心增加高光反光点
  if (isSmall) {
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(cx - r3 * 0.25, cy - r3 * 0.25, r3 * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 挂载不同尺寸
const sizes = [
  { size: 14, label: '14px 按钮' },
  { size: 20, label: '20px 紧凑' },
  { size: 42, label: '42px 页面主态' },
  { size: 72, label: '72px 详情' },
  { size: 96, label: '96px 1:1复刻' },
];

const row = document.getElementById('canvasRow');
const instances = [];

sizes.forEach(s => {
  const item = document.createElement('div');
  item.className = 'size-item';
  const canvas = document.createElement('canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = s.size * dpr;
  canvas.height = s.size * dpr;
  canvas.style.width = s.size + 'px';
  canvas.style.height = s.size + 'px';
  item.appendChild(canvas);

  const lbl = document.createElement('span');
  lbl.textContent = s.label;
  item.appendChild(lbl);
  row.appendChild(item);

  instances.push({ ctx: canvas.getContext('2d'), size: s.size, dpr });
});

const btnCanvas = document.getElementById('btnCanvas');
instances.push({ ctx: btnCanvas.getContext('2d'), size: 14, dpr: window.devicePixelRatio || 1 });

let startTime = performance.now();
let isDark = true;

function loop(now) {
  const t = (now - startTime) / 1000;
  for (const inst of instances) {
    inst.ctx.setTransform(inst.dpr, 0, 0, inst.dpr, 0, 0);
    inst.ctx.clearRect(0, 0, inst.size, inst.size);
    drawTripleOrbs(inst.ctx, inst.size, t, isDark);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('light', !isDark);
  themeBtn.textContent = isDark ? '切换浅色模式' : '切换深色模式';
});
</script>
</body>
</html>
